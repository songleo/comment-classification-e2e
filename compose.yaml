name: comment-classification-e2e

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
    args:
      PYTHON_IMAGE: ${PYTHON_IMAGE:-docker.m.daocloud.io/library/python:3.13.15-slim}
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
      TORCH_FIND_LINKS: ${TORCH_FIND_LINKS:-https://mirrors.aliyun.com/pytorch-wheels/cpu/}
  image: comment-classifier-dev:0.1.0
  environment:
    HF_HOME: /cache/huggingface
    MODEL_DIR: /app/artifacts/model
  volumes:
    - ./artifacts:/app/artifacts
    - huggingface-cache:/cache/huggingface

services:
  e2e:
    <<: *app
    command: ["/bin/sh", "/app/scripts/run-e2e.sh"]

  api:
    <<: *app
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

volumes:
  huggingface-cache:
